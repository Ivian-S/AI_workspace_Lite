# 修改：/project/pyproject.toml

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-workspace-lite"
version = "0.1.0"
description = "A lightweight AI workspace backend learning project."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.139,<0.140",
    "uvicorn[standard]>=0.41,<0.42",
]

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "httpx>=0.28,<0.29",
]

